# KHÓA TRƯỚC KHI LẤY DỮ LIỆU — locked 2026-11-03 (UTC) before any data request.
# Không tự thay mã khác sau khi xem dữ liệu. Mã không tồn tại sẽ được ghi vào report.
#
# Nguồn trọng số dân số: U.S. Census Bureau, 2020 Decennial Census, dân số "incorporated place"
# (city proper), bảng P1 (Total Population), https://data.census.gov/ . Trọng số = dân số thành phố /
# tổng dân số các thành phố được khóa của vùng (chuẩn hóa trong vùng). Không tái chuẩn hóa khi thiếu
# một thành phố: giờ thiếu bất kỳ thành phố nào => nhiệt độ vùng giờ đó = thiếu (C4 rule).
# Tọa độ: tọa độ trung tâm thành phố (WGS84) theo USGS GNIS, làm tròn 4 chữ số.
# Lựa chọn thành phố: các thành phố lớn nằm trong vùng phục vụ của BA. Los Angeles bị loại khỏi CISO
# vì LADWP là BA riêng; El Paso loại khỏi ERCO (không thuộc ERCOT); Memphis loại khỏi MISO (TVA).
# Múi giờ địa phương dùng cho cột giờ địa phương (IANA, xử lý DST bằng zoneinfo).

census_source: "U.S. Census Bureau, 2020 Census, P1 Total Population, incorporated places (data.census.gov)"
coordinate_source: "USGS GNIS city centroid (rounded to 4 decimals)"

